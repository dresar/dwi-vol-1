<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or 'Error' }} — Sistem Rekomendasi Musim Tanam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
    <div class="w-full max-w-lg">
      <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-6">
        <div class="flex items-start gap-3">
          <div class="w-10 h-10 rounded-2xl bg-blue-600 text-white flex items-center justify-center">
            <i class="fa-solid fa-triangle-exclamation"></i>
          </div>
          <div>
            <div class="text-base font-semibold text-slate-900">{{ title or 'Terjadi Kesalahan' }}</div>
            <div class="mt-1 text-sm text-slate-600">{{ message or 'Silakan coba lagi.' }}</div>
          </div>
        </div>
        <div class="mt-5 flex items-center gap-3">
          <a href="/dashboard" class="rounded-xl bg-blue-600 text-white text-sm font-semibold px-4 py-2.5 hover:bg-blue-700 transition">Kembali ke Dashboard</a>
          <a href="/login" class="rounded-xl border border-slate-200 text-sm font-semibold px-4 py-2.5 hover:bg-slate-50 transition">Login</a>
        </div>
      </div>
    </div>
  </body>
</html>
