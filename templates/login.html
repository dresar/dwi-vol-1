<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — Sistem Rekomendasi Musim Tanam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body class="min-h-screen bg-gradient-to-b from-blue-50 to-slate-50 flex items-center justify-center p-6">
    <div class="w-full max-w-md">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-blue-600 text-white shadow-sm">
          <i class="fa-solid fa-seedling"></i>
        </div>
        <h1 class="mt-3 text-xl font-semibold text-slate-900">Sistem Rekomendasi Musim Tanam</h1>
        <p class="mt-1 text-sm text-slate-600">Random Forest + SHAP untuk transparansi keputusan</p>
      </div>

      <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-6">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold text-slate-900">Masuk</h2>
          <span class="text-xs font-medium px-2 py-1 rounded-full bg-blue-50 text-blue-700">Role-based</span>
        </div>

        {% if error %}
          <div class="mt-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
            <div class="flex gap-2 items-start">
              <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
              <div>{{ error }}</div>
            </div>
          </div>
        {% endif %}

        <form class="mt-5 space-y-4" method="post" action="/login">
          <div>
            <label class="block text-xs font-semibold tracking-wider text-slate-600 uppercase">Username</label>
            <input name="username" value="{{ username or '' }}" autocomplete="username" required
              class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400" placeholder="admin / petani" />
          </div>
          <div>
            <label class="block text-xs font-semibold tracking-wider text-slate-600 uppercase">Password</label>
            <div class="mt-2 relative">
              <input id="password" name="password" type="password" autocomplete="current-password" required
                class="w-full rounded-xl border border-slate-200 px-4 py-2.5 pr-11 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400" placeholder="••••••••" />
              <button type="button" data-toggle-password class="absolute inset-y-0 right-0 px-3 text-slate-500 hover:text-slate-700">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit"
            class="w-full rounded-xl bg-blue-600 text-white text-sm font-semibold py-2.5 shadow-sm hover:bg-blue-700 transition">
            Masuk
          </button>
          <div class="text-xs text-slate-500">
            Dummy user: <span class="font-semibold">admin/admin123</span> dan <span class="font-semibold">petani/petani123</span>
          </div>
        </form>
      </div>
      <p class="mt-6 text-center text-xs text-slate-500">© {{ year }} Sistem Rekomendasi Musim Tanam</p>
    </div>

    <script>
      const btn = document.querySelector('[data-toggle-password]')
      if (btn) {
        btn.addEventListener('click', () => {
          const input = document.getElementById('password')
          if (!input) return
          input.type = input.type === 'password' ? 'text' : 'password'
          btn.innerHTML = input.type === 'password' ? '<i class="fa-regular fa-eye"></i>' : '<i class="fa-regular fa-eye-slash"></i>'
        })
      }
    </script>
  </body>
</html>
